<!doctype html>
<html lang="en" data-theme="light">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>[Your Name] — Research Portfolio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,600;1,400&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ── Tokens ── */
    :root {
      --font-sans: 'Inter', system-ui, -apple-system, sans-serif;
      --font-serif: 'Spectral', Georgia, serif;
      --radius: 6px;
      --nav-h: 52px;
      --max-w: 720px;
    }
    [data-theme="light"] {
      --bg:      #f7f6f3;
      --surface: #ffffff;
      --border:  #e4e4e0;
      --ink:     #18181b;
      --sub:     #3f3f46;
      --muted:   #71717a;
      --accent:  #2d5be3;
      --tag-bg:  #f0f0ee;
    }
    [data-theme="dark"] {
      --bg:      #111110;
      --surface: #1a1a18;
      --border:  #2e2e2c;
      --ink:     #e8e8e4;
      --sub:     #c4c4be;
      --muted:   #7c7c76;
      --accent:  #7cacff;
      --tag-bg:  #222220;
    }

    /* ── Base ── */
    html { scroll-behavior: smooth; }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--ink);
      font-size: 16px;
      line-height: 1.6;
      transition: background .25s, color .25s;
      -webkit-font-smoothing: antialiased;
    }
    a { color: var(--accent); text-decoration: none; }
    a:hover { text-decoration: underline; }

    /* ── Sticky header ── */
    #topbar {
      position: sticky;
      top: 0;
      z-index: 40;
      height: var(--nav-h);
      background: var(--bg);
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      padding: 0 2rem;
      gap: 1.5rem;
    }
    #logo {
      font-family: var(--font-serif);
      font-size: 1rem;
      font-weight: 600;
      color: var(--ink);
      letter-spacing: -.01em;
      margin-right: auto;
      text-decoration: none;
    }
    #logo:hover { text-decoration: none; }
    .topnav { display: flex; gap: .1rem; }
    .topnav a {
      font-size: .8rem;
      font-weight: 500;
      color: var(--muted);
      padding: .3rem .6rem;
      border-radius: var(--radius);
      text-decoration: none;
      letter-spacing: .01em;
      transition: color .15s, background .15s;
    }
    .topnav a:hover { color: var(--ink); background: var(--border); text-decoration: none; }
    #theme-btn {
      background: none;
      border: 1px solid var(--border);
      cursor: pointer;
      width: 30px; height: 30px;
      border-radius: var(--radius);
      font-size: .85rem;
      display: grid; place-items: center;
      color: var(--muted);
      transition: background .15s, color .15s;
      flex-shrink: 0;
    }
    #theme-btn:hover { background: var(--border); color: var(--ink); }

    /* ── Page ── */
    main {
      max-width: var(--max-w);
      margin: 0 auto;
      padding: 3.5rem 2rem 6rem;
      display: flex;
      flex-direction: column;
      gap: 0;
    }

    /* ── Hero ── */
    #hero { padding-bottom: 3rem; border-bottom: 1px solid var(--border); }
    .hero-inner {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 2rem;
      align-items: start;
    }
    .hero-name {
      font-family: var(--font-serif);
      font-size: clamp(2rem, 5vw, 2.8rem);
      font-weight: 600;
      letter-spacing: -.02em;
      line-height: 1.1;
      color: var(--ink);
      margin-bottom: .4rem;
    }
    .hero-title {
      font-size: .9rem;
      font-weight: 400;
      color: var(--muted);
      letter-spacing: .01em;
      margin-bottom: 1.25rem;
    }
    .hero-bio {
      font-size: .975rem;
      color: var(--sub);
      line-height: 1.7;
      max-width: 52ch;
    }
    .hero-links { display: flex; flex-wrap: wrap; gap: .4rem; margin-top: 1.25rem; }
    .hero-link {
      font-size: .78rem;
      font-weight: 500;
      padding: .28rem .7rem;
      border: 1px solid var(--border);
      border-radius: 999px;
      color: var(--muted);
      background: var(--surface);
      text-decoration: none;
      letter-spacing: .01em;
      transition: color .15s, border-color .15s;
    }
    .hero-link:hover { color: var(--accent); border-color: var(--accent); text-decoration: none; }
    .profile-pic {
      width: 130px; height: 130px;
      border-radius: 50%;
      object-fit: cover;
      border: 1px solid var(--border);
      flex-shrink: 0;
    }

    /* ── Section ── */
    .section { border-bottom: 1px solid var(--border); }
    .section-toggle {
      width: 100%;
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.4rem 0;
      text-align: left;
      gap: 1rem;
    }
    .section-toggle:hover .section-title { color: var(--ink); }
    .section-title {
      font-family: var(--font-sans);
      font-size: 1rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
      transition: color .15s;
    }
    .section-icon {
      font-size: .7rem;
      color: var(--muted);
      transition: transform .25s;
      flex-shrink: 0;
    }
    .section-icon.open { transform: rotate(45deg); }
    .section-body { overflow: hidden; }
    .section-body.collapsed { display: none; }
    .section-body-inner { padding-bottom: 1.75rem; }

    /* ── SKILLS ── */
    .skills-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 0; }
    .skill-card {
      padding: .9rem 1rem .9rem 0;
      border-bottom: 1px solid var(--border);
    }
    .skill-card:nth-child(odd) { padding-right: 2rem; }
    .skill-group {
      font-size: .72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--accent);
      margin-bottom: .35rem;
    }
    .skill-items {
      font-size: .88rem;
      color: var(--sub);
      line-height: 1.6;
    }

    /* ── EXPERIENCE ── */
    .exp-list { display: flex; flex-direction: column; gap: 0; }
    .exp-item {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: .5rem 1.5rem;
      padding: 1rem 0;
      border-bottom: 1px solid var(--border);
      align-items: baseline;
    }
    .exp-item:last-child { border-bottom: none; padding-bottom: 0; }
    .exp-role {
      font-size: .97rem;
      font-weight: 600;
      color: var(--ink);
      margin-bottom: .12rem;
    }
    .exp-org {
      font-size: .85rem;
      color: var(--accent);
      margin-bottom: .35rem;
    }
    .exp-summary { font-size: .88rem; color: var(--muted); line-height: 1.6; }
    .exp-date {
      font-size: .78rem;
      color: var(--muted);
      white-space: nowrap;
      font-weight: 400;
      text-align: right;
    }

    /* ── GALLERY menu (main page) ── */
    .gal-menu { list-style: none; display: flex; flex-direction: column; gap: 0; }
    .gal-menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      background: none;
      border: none;
      border-bottom: 1px solid var(--border);
      padding: .75rem 0;
      cursor: pointer;
      font-family: var(--font-sans);
      font-size: .92rem;
      font-weight: 500;
      color: var(--ink);
      text-align: left;
      transition: color .15s;
    }
    .gal-menu-item:first-child { border-top: 1px solid var(--border); }
    .gal-menu-item:hover { color: var(--accent); }
    .gal-menu-item .gal-arrow { font-size: .8rem; color: var(--muted); }
    .gal-menu-item:hover .gal-arrow { color: var(--accent); }

    /* ── GALLERY overlay ── */
    #gal-overlay {
      position: fixed; inset: 0; z-index: 100;
      display: flex;
      background: var(--bg);
    }
    #gal-overlay[hidden] { display: none; }

    /* sidebar */
    #gal-sidebar {
      width: 220px;
      flex-shrink: 0;
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow-y: auto;
    }
    #gal-sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.1rem .75rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    #gal-sidebar-header span {
      font-size: .68rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: .1em;
      color: var(--muted);
    }
    #gal-close-btn {
      background: none; border: none; cursor: pointer;
      font-size: 1.1rem; color: var(--muted);
      width: 28px; height: 28px;
      display: grid; place-items: center;
      border-radius: var(--radius);
      transition: background .12s, color .12s;
    }
    #gal-close-btn:hover { background: var(--border); color: var(--ink); }
    #gal-sidebar-list { list-style: none; padding: .5rem 0; flex: 1; }
    .gal-cat-btn {
      display: block;
      width: 100%;
      background: none;
      border: none;
      cursor: pointer;
      text-align: left;
      padding: .6rem 1.1rem;
      font-family: var(--font-sans);
      font-size: .85rem;
      color: var(--muted);
      border-radius: 0;
      transition: background .12s, color .12s;
    }
    .gal-cat-btn:hover { background: var(--tag-bg); color: var(--ink); }
    .gal-cat-btn.active {
      background: var(--tag-bg);
      color: var(--accent);
      font-weight: 600;
    }

    /* viewer */
    #gal-viewer {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background: var(--surface);
    }
    #gal-viewer-top {
      flex: 1;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0d0d0d;
      overflow: hidden;
    }
    #gal-media-wrap {
      width: 100%; height: 100%;
      display: flex; align-items: center; justify-content: center;
      padding: 2.5rem 3.5rem;
    }
    #gal-media-wrap img, #gal-media-wrap video {
      max-width: 100%; max-height: 100%;
      object-fit: contain;
      display: block;
    }
    .gal-nav-btn {
      position: absolute; top: 50%; transform: translateY(-50%);
      background: rgba(0,0,0,.45); border: 1px solid rgba(255,255,255,.15);
      color: #fff; width: 44px; height: 44px; border-radius: 8px;
      display: grid; place-items: center; cursor: pointer; font-size: 1rem;
      transition: background .15s;
    }
    .gal-nav-btn:hover { background: rgba(0,0,0,.7); }
    #gal-prev-btn { left: 1rem; } #gal-next-btn { right: 1rem; }
    #gal-viewer-bottom {
      padding: .85rem 1.25rem;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      flex-shrink: 0;
    }
    #gal-info-title   { font-size: .92rem; font-weight: 600; color: var(--ink); }
    #gal-info-caption { font-size: .82rem; color: var(--muted); margin-top: .15rem; }
    #gal-info-count   { font-size: .78rem; color: var(--muted); font-family: monospace; white-space: nowrap; }

    @media (max-width: 600px) {
      #gal-sidebar { width: 160px; }
    }

    /* ── PUBLICATIONS ── */
    .pub-list { display: flex; flex-direction: column; gap: 0; }
    .pub-item { padding: .9rem 0; border-bottom: 1px solid var(--border); }
    .pub-item:last-child { border-bottom: none; padding-bottom: 0; }
    .pub-title-row { display: flex; justify-content: space-between; gap: 1rem; align-items: baseline; }
    .pub-title {
      font-size: .95rem;
      font-weight: 500;
      color: var(--ink);
      line-height: 1.45;
      flex: 1;
    }
    .pub-link { font-size: .8rem; color: var(--accent); white-space: nowrap; flex-shrink: 0; }
    .pub-venue { font-size: .82rem; color: var(--muted); margin-top: .2rem; }
    .pub-abstract-toggle {
      background: none; border: none; cursor: pointer;
      font-size: .76rem; color: var(--muted); padding: .3rem 0 0;
      font-family: var(--font-sans); letter-spacing: .01em;
      display: flex; align-items: center; gap: .3rem;
      transition: color .15s;
    }
    .pub-abstract-toggle:hover { color: var(--accent); }
    .pub-abstract {
      font-size: .86rem;
      color: var(--muted);
      line-height: 1.6;
      margin-top: .5rem;
      display: none;
    }
    .pub-abstract.open { display: block; }

    /* ── CONTACT ── */
    .contact-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: .6rem; }
    .contact-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: .85rem 1rem;
    }
    .c-label { font-size: .68rem; font-weight: 600; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-bottom: .3rem; }
    .c-val   { font-size: .9rem; font-weight: 500; }


    @media (max-width: 600px) {
      main { padding: 2rem 1.25rem 5rem; }
      #topbar { padding: 0 1.25rem; }
      .hero-inner { grid-template-columns: 1fr; }
      .profile-pic { display: none; }
      .exp-item { grid-template-columns: 1fr; }
      .exp-date { text-align: left; }
    }
  </style>
</head>

  <!-- ── CONTACT ── -->

    <div class="section-body collapsed" id="contact-body">
      <div class="section-body-inner">
        <div class="contact-grid" id="contact-grid"></div>
      </div>

  </div>

</main>

      </div>
      <div id="gal-info-count"></div>
    </div>
  </div>
</div>

// ── Theme ─────────────────────────────────────────────────────────
const themeBtn = document.getElementById('theme-btn');
let theme = localStorage.getItem('theme') || 'light';
applyTheme(theme);
themeBtn.addEventListener('click', () => {
  theme = theme === 'light' ? 'dark' : 'light';
  applyTheme(theme);
  localStorage.setItem('theme', theme);
});
function applyTheme(t) {
  document.documentElement.setAttribute('data-theme', t);
  themeBtn.textContent = t === 'light' ? '☾' : '☀';
}

// ── Section fold ──────────────────────────────────────────────────
document.querySelectorAll('.section-toggle').forEach(btn => {
  const bodyId = btn.dataset.target;
  const body   = document.getElementById(bodyId);
  const icon   = btn.querySelector('.section-icon');

  btn.addEventListener('click', () => {
    const isOpen = btn.getAttribute('aria-expanded') === 'true';
    btn.setAttribute('aria-expanded', String(!isOpen));
    body.classList.toggle('collapsed', isOpen);
    icon.classList.toggle('open', !isOpen);
  });
});

// ── Gallery ───────────────────────────────────────────────────────
const isVideo = s => /\.(mp4|webm|mov)$/i.test(s);

function mkMedia(src, alt) {
  if (isVideo(src)) {
    const v = document.createElement('video');
    Object.assign(v, { muted: true, playsInline: true, loop: true, autoplay: true, src });
    v.style.cssText = 'max-width:100%;max-height:100%;object-fit:contain';
    return v;
  }
  const img = document.createElement('img');
  img.src = src; img.alt = alt || '';
  img.style.cssText = 'max-width:100%;max-height:100%;object-fit:contain';
  return img;
}

// Build sidebar category list
const sidebarList = document.getElementById('gal-sidebar-list');
GALLERIES.forEach((gal, gi) => {
  const li  = document.createElement('li');
  const btn = document.createElement('button');
  btn.className   = 'gal-cat-btn';
  btn.textContent = gal.title;
  btn.dataset.gi  = gi;
  li.appendChild(btn);
  sidebarList.appendChild(li);
});

// Build main-page menu (titles only, no previews)
const galMenu = document.getElementById('gal-menu');
GALLERIES.forEach((gal, gi) => {
  const li  = document.createElement('li');
  const btn = document.createElement('button');
  btn.className = 'gal-menu-item';
  btn.innerHTML = `<span>${gal.title}</span><span class="gal-arrow">→</span>`;
  btn.addEventListener('click', () => openGallery(gi));
  li.appendChild(btn);
  galMenu.appendChild(li);
});

// Overlay state
const overlay   = document.getElementById('gal-overlay');
const mediaWrap = document.getElementById('gal-media-wrap');
const infoTitle = document.getElementById('gal-info-title');
const infoCap   = document.getElementById('gal-info-caption');
const infoCount = document.getElementById('gal-info-count');
let activeGi = 0, activeIdx = 0;

function renderViewer() {
  const gal  = GALLERIES[activeGi];
  const item = gal.images[activeIdx];
  mediaWrap.innerHTML = '';
  mediaWrap.appendChild(mkMedia(item.src, item.alt));
  infoTitle.textContent = gal.title;
  infoCap.textContent   = gal.caption;
  infoCount.textContent = `${activeIdx + 1} / ${gal.images.length}`;
  // highlight active sidebar item
  document.querySelectorAll('.gal-cat-btn').forEach(b =>
    b.classList.toggle('active', Number(b.dataset.gi) === activeGi)
  );
}

function openGallery(gi) {
  activeGi  = gi;
  activeIdx = 0;
  renderViewer();
  overlay.hidden = false;
  document.body.style.overflow = 'hidden';
}

function closeGallery() {
  overlay.hidden = true;
  document.body.style.overflow = '';
  mediaWrap.innerHTML = '';
}

function showImg(delta) {
  const len = GALLERIES[activeGi].images.length;
  activeIdx = (activeIdx + delta + len) % len;
  renderViewer();
}

document.getElementById('gal-close-btn').onclick = closeGallery;
document.getElementById('gal-prev-btn').onclick  = () => showImg(-1);
document.getElementById('gal-next-btn').onclick  = () => showImg(+1);

// sidebar clicks switch category
sidebarList.addEventListener('click', e => {
  const btn = e.target.closest('.gal-cat-btn');
  if (!btn) return;
  activeGi  = Number(btn.dataset.gi);
  activeIdx = 0;
  renderViewer();
});

// keyboard nav
document.addEventListener('keydown', e => {
  if (overlay.hidden) return;
  if (e.key === 'Escape')     closeGallery();
  if (e.key === 'ArrowRight') showImg(+1);
  if (e.key === 'ArrowLeft')  showImg(-1);
});
</script>
